name: beta release
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  changelog:
    strategy:
      matrix:
        platform:
        - ubuntu-latest
        go-version:
        - '1.21'
    name: Beta Release Changelog
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Create or update ref
      id: create-or-update-ref
      uses: ovsds/create-or-update-ref-action@1157b2991820188d5a8e6f22656775d1d171f762 # v1.1.0
      with:
        ref: tags/beta
        sha: ${{ github.sha }}
    - name: Delete beta tag
      run: git tag -d beta
      continue-on-error: true
    - name: changelog
      id: changelog
      run: |
        git tag -l
        npx changelogithub --output CHANGELOG.md
        MAX=120000
        LEN=$(wc -c < CHANGELOG.md)
        if [ "$LEN" -gt "$MAX" ]; then
          echo "CHANGELOG.md too long ($LEN chars), truncating to $MAX chars..."
          head -c $MAX CHANGELOG.md > tmp && echo -e "\n\n---\n**Truncated due to GitHub release body size limit.**" >> tmp && mv tmp CHANGELOG.md
        fi
    - name: Upload assets
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        body_path: CHANGELOG.md
        files: CHANGELOG.md
        prerelease: true
        tag_name: beta
    env:
      GOPROXY: https://proxy.golang.org|direct
  release:
    needs:
    - changelog
    strategy:
      matrix:
        include:
        - target: linux-!(arm*)-musl*
          hash: md5-linux-musl
        - target: linux-arm*-musl*
          hash: md5-linux-musl-arm
    name: Beta Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
    - name: Setup web
      run: bash build.sh dev web
    - name: Build
      uses: go-cross/cgo-actions@454cfd6d20816878926b0253ca8f2dbbd2f7d731 # v1.1.0
      with:
        targets: ${{ matrix.target }}
        musl-target-format: $os-$musl-$arch
        out-dir: build
        x-flags: |
          github.com/oneclickvirt/alist/v3/internal/conf.BuiltAt=$built_at
          github.com/oneclickvirt/alist/v3/internal/conf.GitAuthor=Xhofe
          github.com/oneclickvirt/alist/v3/internal/conf.GitCommit=$git_commit
          github.com/oneclickvirt/alist/v3/internal/conf.Version=$tag
          github.com/oneclickvirt/alist/v3/internal/conf.WebVersion=dev
    - name: Compress
      run: |
        bash build.sh zip ${{ matrix.hash }}
    - name: Upload assets
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: build/compress/*
        prerelease: true
        tag_name: beta
    env:
      GOPROXY: https://proxy.golang.org|direct
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
