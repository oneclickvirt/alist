name: build
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      matrix:
        platform:
        - ubuntu-latest
        target:
        - linux-arm64-musl
        - linux-amd64-musl
    name: Build
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: benjlevesque/short-sha@dbe07338b37c456ce06d23409b35a56a7815eef4 # v4.0
      id: short-sha
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
    - name: Setup web
      run: bash build.sh dev web
    - name: Build
      uses: go-cross/cgo-actions@454cfd6d20816878926b0253ca8f2dbbd2f7d731 # v1.1.0
      with:
        targets: ${{ matrix.target }}
        musl-target-format: $os-$musl-$arch
        out-dir: build
        x-flags: |
          github.com/oneclickvirt/alist/v3/internal/conf.BuiltAt=$built_at
          github.com/oneclickvirt/alist/v3/internal/conf.GitAuthor=Xhofe
          github.com/oneclickvirt/alist/v3/internal/conf.GitCommit=$git_commit
          github.com/oneclickvirt/alist/v3/internal/conf.Version=$tag
          github.com/oneclickvirt/alist/v3/internal/conf.WebVersion=dev
    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: alist_${{ env.SHA }}_${{ matrix.target }}
        path: build/*
    env:
      GOPROXY: https://proxy.golang.org|direct
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
