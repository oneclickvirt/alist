name: Close need info
jobs:
  close-need-info:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: close-issues
      run: python3 .github/scripts/issue_automation.py
      env:
        ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ISSUE_ACTION: close-issues
        ISSUE_LABELS: question
        ISSUE_INACTIVE_DAYS: '3'
        ISSUE_BODY: |-
          Hello @{user}, this issue was closed due to no activities in 3 days.
          你好 @{user}，此issue因超过3天未回复被关闭。
        ISSUE_CLOSE_REASON: not_planned
    permissions:
      contents: read
      issues: write
'on':
  schedule:
  - cron: 0 0 */1 * *
  workflow_dispatch: null
