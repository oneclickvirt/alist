name: release_docker
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: spiritlhl/alist
  REGISTRY_USERNAME: spiritlhl
  REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
  ARTIFACT_NAME: binaries_docker_release
  RELEASE_PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7,linux/386,linux/arm/v6,linux/s390x,linux/ppc64le,linux/riscv64
  IMAGE_PUSH: ${{ github.event_name == 'push' }}
  IMAGE_IS_PROD: ${{ github.ref_type == 'tag' }}
  IMAGE_TAGS_BETA: |
    type=schedule
    type=ref,event=branch
    type=ref,event=tag
    type=ref,event=pr
    type=raw,value=beta,enable={{is_default_branch}}
jobs:
  build_binary:
    name: Build Binaries for Docker Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
    - name: Cache Musl
      id: cache-musl
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build/musl-libs
        key: docker-musl-libs-v2
    - name: Download Musl Library
      if: steps.cache-musl.outputs.cache-hit != 'true'
      run: bash build.sh prepare docker-multiplatform
    - name: Build go binary (beta)
      if: env.IMAGE_IS_PROD != 'true'
      run: bash build.sh beta docker-multiplatform
    - name: Build go binary (release)
      if: env.IMAGE_IS_PROD == 'true'
      run: bash build.sh release docker-multiplatform
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ env.ARTIFACT_NAME }}
        overwrite: true
        path: |
          build/
          !build/*.tgz
          !build/musl-libs/**
    env:
      GOPROXY: https://proxy.golang.org|direct
  release_docker:
    needs: build_binary
    name: Release Docker image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
        - latest
        - ffmpeg
        - aria2
        - aio
        include:
        - image: latest
          build_arg: ''
          tag_favor: ''
        - image: ffmpeg
          build_arg: INSTALL_FFMPEG=true
          tag_favor: suffix=-ffmpeg,onlatest=true
        - image: aria2
          build_arg: INSTALL_ARIA2=true
          tag_favor: suffix=-aria2,onlatest=true
        - image: aio
          build_arg: |
            INSTALL_FFMPEG=true
            INSTALL_ARIA2=true
          tag_favor: suffix=-aio,onlatest=true
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: build/
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Login to DockerHub
      if: env.IMAGE_PUSH == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        logout: true
        username: ${{ env.REGISTRY_USERNAME }}
        password: ${{ env.REGISTRY_PASSWORD }}
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.REGISTRY }}
        tags: ${{ env.IMAGE_IS_PROD == 'true' && '' || env.IMAGE_TAGS_BETA }}
        flavor: |
          ${{ env.IMAGE_IS_PROD == 'true' && 'latest=true' || '' }}
          ${{ matrix.tag_favor }}
    - name: Build and push
      id: docker_build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: Dockerfile.ci
        push: ${{ env.IMAGE_PUSH == 'true' }}
        build-args: ${{ matrix.build_arg }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: ${{ env.RELEASE_PLATFORMS }}
'on':
  push:
    tags:
    - v*
    branches:
    - main
  pull_request:
    branches:
    - main
