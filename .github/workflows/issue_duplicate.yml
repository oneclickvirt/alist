name: Issue Duplicate
jobs:
  create-comment:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'duplicate'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Create comment
      run: python3 .github/scripts/issue_automation.py
      env:
        ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ISSUE_ACTION: create-comment
        ISSUE_LABELS: ''
        ISSUE_INACTIVE_DAYS: '0'
        ISSUE_BODY: |
          Hello @{user}, your issue is a duplicate and will be closed.
          你好 @{user}，你的issue是重复的，将被关闭。
        ISSUE_CLOSE_REASON: completed
    - name: Close issue
      run: python3 .github/scripts/issue_automation.py
      env:
        ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ISSUE_ACTION: close-issue
        ISSUE_LABELS: ''
        ISSUE_INACTIVE_DAYS: '0'
        ISSUE_BODY: ''
        ISSUE_CLOSE_REASON: completed
    permissions:
      contents: read
      issues: write
'on':
  issues:
    types:
    - labeled
